<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5b6cf0"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="מרכז לימודים"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<title>מרכז לימודים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1e2233;--mu:#7a8094;--ln:#e6e8f0;--ac:#5b6cf0;--acs:#eceefe;--rd:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--card:#1e212d;--tx:#eceef6;--mu:#9299b0;--ln:#2c3040;--ac:#8290ff;--acs:#262a44}}
:root[data-theme="dark"]{--bg:#14161f;--card:#1e212d;--tx:#eceef6;--mu:#9299b0;--ln:#2c3040;--ac:#8290ff;--acs:#262a44}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Heebo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:16px}
#app{max-width:640px;margin:0 auto;padding:20px 16px 150px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:26px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mu);font-size:14px;margin:0 0 16px}
h3{font-size:15px;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:center}
h3 span{color:var(--mu);font-weight:500;font-size:13px}
.top{display:flex;align-items:center;gap:10px}
.back{width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--ln);font-size:20px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.days button{flex:1 0 auto;min-width:50px;min-height:50px;padding:6px 10px;line-height:1.25;border-radius:14px;background:var(--card);border:1px solid var(--ln);font-weight:500;color:var(--mu)}
.days small{display:block;font-size:12px;font-weight:400;opacity:.85}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.clk{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ac);line-height:1.2;padding-top:4px}
.ls.br.eod{justify-content:center;color:var(--ac);font-weight:700;border:1px solid var(--ac);background:var(--acs)}
.ls.now{background:var(--acs);border-color:var(--ac)}.tag{background:var(--ac);color:#fff;border-radius:99px;font-size:12px;padding:2px 10px;font-weight:700}.tag.nx{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.days button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.days button.today:not(.on){color:var(--ac);border-color:var(--ac)}
.ls{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:8px;min-height:64px;border-inline-start:5px solid var(--c)}
.ls time{width:44px;color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}
.ls .ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.ls b{flex:1;font-size:17px}
.ls .n{background:var(--acs);color:var(--ac);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:13px;font-weight:700;padding:0 8px}
.ls .go{color:var(--mu)}
.ls.br{background:transparent;border:1px dashed var(--ln);border-inline-start:1px dashed var(--ln);min-height:44px;color:var(--mu);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px}.acts button{height:40px;padding:0 14px;border-radius:12px;background:var(--acs);color:var(--ac);font-weight:700;font-size:14px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#1e2233;color:#fff;padding:10px 18px;border-radius:99px;z-index:20;font-size:14px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}.wd{text-align:center;color:var(--mu);font-size:12px;padding:4px 0}
.cd{aspect-ratio:1;min-height:44px;border-radius:12px;background:var(--card);border:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:500}
.cd i{display:flex;gap:2px;height:6px}.cd b{width:6px;height:6px;border-radius:50%}.cd.td{border-color:var(--ac);color:var(--ac);font-weight:800}.cd.sel{background:var(--ac);border-color:var(--ac);color:#fff}.cd.sat{opacity:.65}
.dg{flex:none;width:34px;height:44px;border-radius:10px;color:var(--mu);font-size:20px;touch-action:none;cursor:grab;user-select:none}.er.drag{opacity:.45}.er.ovr{box-shadow:0 0 0 2px var(--ac);border-radius:12px}.btn.dng{background:var(--rd);color:#fff}
.cd.hol{background:color-mix(in srgb,var(--ac) 14%,var(--card))}#app.hol .ls{opacity:.45}#app.hol .eod{display:none}.toast button{color:#b7c0ff;font-weight:700;margin-inline-start:14px}
.tm{background:var(--card);border:1px solid var(--ac);border-radius:16px;padding:14px;margin-bottom:12px}.tm .tk{background:var(--bg)}
.tml{color:var(--mu);font-size:13px;margin:4px 0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tm .chip{font-style:normal;font-size:13px;padding:3px 10px}
.err{color:var(--rd);font-size:13px;min-height:18px;margin-top:8px}
.bn{background:var(--acs);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-size:14px}
.tk{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:8px;border-inline-start:5px solid var(--c,var(--ln));transition:opacity .4s,transform .4s}
.tk.pop{opacity:0;transform:translateX(-24px) scale(.97)}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--mu);display:grid;place-items:center;color:#fff;font-weight:800;margin-top:1px;transition:.2s}
.tk.pop .ck,.tk.dn .ck{background:var(--ac);border-color:var(--ac)}
.tk.pop .ck::after{content:'✓'}
.tk.dn .tb b{text-decoration:line-through;color:var(--mu)}
.tb{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.tb b{display:block;font-weight:500;overflow-wrap:anywhere}
.tb small{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mu);font-size:13px;margin-top:2px}
.tb small i{font-style:normal}
.tb .late{color:var(--rd);font-weight:700}
.chip{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--tx);border-radius:99px;padding:1px 9px}
.tb em{display:block;font-style:normal;color:var(--mu);font-size:13px;margin-top:4px}
.emp{color:var(--mu);font-size:14px;padding:6px 2px}
.big{text-align:center;color:var(--mu);padding:40px 10px}
.flt{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.flt button{flex:none;height:40px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--ln);color:var(--mu)}
.flt button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav div{max-width:640px;margin:auto;display:flex}
nav button{flex:1;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mu)}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--ac);font-weight:700}
.fab{position:fixed;inset-inline-end:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(60,70,180,.35);z-index:6}
.ov{position:fixed;inset:0;background:rgba(10,12,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:24px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sheet h2{margin:0 0 14px;font-size:20px}
label.f{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.in{width:100%;height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);padding:0 12px}
textarea.in{height:70px;padding:10px 12px;resize:none}
.row2{display:flex;gap:10px}.row2>div{flex:1}
.seg{display:flex;gap:6px}
.seg label{flex:1}
.seg input{position:absolute;opacity:0}
.seg span{display:grid;place-items:center;height:46px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);font-size:14px;color:var(--mu)}
.seg input:checked+span{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--ac);outline-offset:2px}
.btn{width:100%;height:50px;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;margin-top:18px}
.btn.ghost{background:var(--acs);color:var(--ac);margin-top:10px}
.btn.del{background:transparent;color:var(--rd);margin-top:4px;height:44px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:10px}
.er{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.er .in{flex:1;min-width:0}.er .tm{flex:none;width:92px;text-align:center;font-variant-numeric:tabular-nums}
.er input[type=color]{flex:none;width:46px;height:46px;padding:3px;border-radius:12px;border:1px solid var(--ln);background:var(--bg)}
.er .ic{flex:none;width:54px;text-align:center}
.x{flex:none;width:44px;height:44px;border-radius:12px;color:var(--rd);font-size:16px}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" data-a="add" aria-label="הוסף משימה">+</button>
<nav><div id="nav"></div></nav>
<div id="md"></div>
<script>
let K='study-hub-v2';const DN=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const TY={hw:'שיעורי בית',proj:'עבודות',test:'מבחנים'},TS={hw:'שיעורי בית',proj:'עבודה',test:'מבחן'};
const PAL=['#7c9cf5','#f29bb5','#6fcfb0','#a78bfa','#f5b970','#7cc4e8','#8fd18a','#f08f8f','#e6a1e0','#82d4d0','#c9b37a','#9fb0c8'];
const pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=s=>Math.round((new Date(s+'T00:00')-new Date(iso(new Date())+'T00:00'))/864e5);
const fd=s=>{const[,b,c]=s.split('-');return +c+'/'+ +b};
const rel=s=>{const n=diff(s);return n<0?'באיחור · '+fd(s):n==0?'היום':n==1?'מחר':n==2?'בעוד יומיים':n<7?'ביום '+DN[new Date(s+'T00:00').getDay()]:fd(s)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const SV='img2';
const SCHED=()=>({
0:[['08:15','lit'],['09:00','psy'],['09:45','break'],['10:05','math'],['10:50','math'],['11:35','break'],['11:55','his'],['12:40','his'],['13:25','break'],['13:40','tan'],['14:25','break'],['14:30','eng'],['15:15','tan']],
1:[['08:15','phy'],['09:00','phy'],['09:45','break'],['10:05','lash'],['10:50','spo'],['11:35','break'],['11:55','cs'],['12:40','cs'],['13:25','break'],['13:40','cs']],
2:[['08:15','phy'],['09:00','phy'],['09:45','break'],['10:05','math'],['10:50','math'],['11:35','break'],['11:55','chi'],['12:40','eng']],
3:[['08:15','free'],['09:00','free'],['09:45','break'],['10:05','math'],['10:50','eng'],['11:35','break'],['11:55','spo'],['12:40','lit'],['13:25','break'],['13:40','chi'],['14:25','break'],['14:30','trf']],
4:[['08:15','math'],['09:00','math'],['09:45','break'],['10:05','lash'],['10:50','his'],['11:35','break'],['11:55','lash'],['12:40','chi'],['13:25','break'],['13:40','eng']],
5:[['08:15','free'],['09:00','free'],['09:45','break'],['10:05','free'],['10:50','cs'],['11:35','break'],['11:55','cs'],['12:40','cs']]});
const DEF=()=>({subjects:[
 {id:'lit',name:'ספרות',color:PAL[0],icon:'📚'},{id:'psy',name:'השכלה כללית - פסיכולוגיה',color:PAL[1],icon:'🧠'},
 {id:'math',name:'מתמטיקה',color:PAL[2],icon:'➗'},{id:'his',name:'היסטוריה',color:PAL[3],icon:'🏛️'},
 {id:'tan',name:'תנ״ך',color:PAL[4],icon:'📜'},{id:'eng',name:'אנגלית',color:PAL[5],icon:'🅰️'},
 {id:'phy',name:'פיזיקה',color:PAL[6],icon:'⚛️'},{id:'lash',name:'לשון',color:PAL[7],icon:'✍️'},
 {id:'spo',name:'ספורט',color:PAL[8],icon:'⚽'},{id:'cs',name:'מדעי המחשב',color:PAL[9],icon:'💻'},
 {id:'chi',name:'חינוך',color:PAL[10],icon:'🎓'},{id:'trf',name:'חינוך תעבורתי',color:PAL[11],icon:'🚦'}],
 sched:SCHED(),sv:SV,
 tasks:[],name:'',notif:false,sent:{}});
let APPLIED=0;
function load(){try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.subjects){if(d.sv!==SV){d.sched=SCHED();d.sv=SV;APPLIED=1;const ref=new Set(Object.values(d.sched).flat().map(l=>l[1]));DEF().subjects.forEach(x=>{if(ref.has(x.id)&&!d.subjects.some(y=>y.id===x.id))d.subjects.push(x)})}for(const k in d.sched)d.sched[k]=d.sched[k].map(l=>Array.isArray(l)?{t:l[0],s:l[1]}:l);d.sent=d.sent||{};d.name=d.name||'';d.notif=!!d.notif;return d}}catch(e){}
 const d=DEF();for(const k in d.sched)d.sched[k]=d.sched[k].map(l=>({t:l[0],s:l[1]}));return d}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const getUsers=()=>{try{return JSON.parse(localStorage.getItem('sh-users'))||{}}catch(e){return{}}};
let S=null;
let td=new Date().getDay(),TODAY=iso(new Date());
const U={v:'home',day:td,sid:null,f:'all',m:null,auth:false,su:false,ci:null,cd:null};
const normT=v=>{const d=String(v).replace(/\D/g,'');if(!d)return null;const h=d.length<=2?+d:+d.slice(0,-2),m=d.length<=2?0:+d.slice(-2);return h>23||m>59?null:pad(h)+':'+pad(m)};
const sub=id=>S.subjects.find(x=>x.id===id)||{name:'?',color:'#999',icon:'•'};
const act=sid=>S.tasks.filter(t=>t.sid===sid&&!t.done).length;
const byDate=(a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''));

function row(t,showS){const s=sub(t.sid),late=!t.done&&diff(t.date)<0;
 return `<div class="tk ${t.done?'dn':''}" style="--c:${esc(s.color)}"><button class="ck" data-a="chk" data-i="${t.id}" aria-label="סמן כהושלם">${t.done?'✓':''}</button><div class="tb" data-a="edit" data-i="${t.id}"><b>${esc(t.title)}</b><small>${showS?`<i class="chip">${esc(s.icon)} ${esc(s.name)}</i>`:''}<i class="${late?'late':''}">${t.type!=='hw'?TS[t.type]+' · ':''}${rel(t.date)}${t.time?' · '+esc(t.time):''}</i></small>${t.note?`<em>${esc(t.note)}</em>`:''}</div></div>`}
const dayTabs=dt=>`<div class="days">${DN.slice(0,dt?7:6).map((n,i)=>`<button class="${i===U.day?'on':''} ${i===td?'today':''}" data-a="day" data-i="${i}">${n}${dt?`<small>${+dayDate(i).slice(8)}</small>`:''}</button>`).join('')}</div>`;

const HOL=[['2026-09-11','2026-09-13','ראש השנה'],['2026-09-20','2026-10-03','חופשת יום כיפור וסוכות'],['2026-12-06','2026-12-12','חופשת חנוכה'],['2027-03-23','2027-03-24','חופשת פורים'],['2027-04-13','2027-04-28','חופשת פסח'],['2027-05-12','2027-05-12','יום העצמאות'],['2027-06-10','2027-06-11','חופשת שבועות'],['2027-06-21','2027-08-31','החופש הגדול']];
const SHORT={'2027-05-11':'יום הזיכרון – הלימודים מסתיימים ב-12:00'};
const holAt=d=>(HOL.find(h=>d>=h[0]&&d<=h[1])||[])[2]||null;
const dnote=d=>holAt(d)?`<div class="bn">🎉 ${holAt(d)} – אין לימודים</div>`:SHORT[d]?`<div class="bn">🕯️ ${SHORT[d]}</div>`:'';
const eff=(d,L)=>{const o=(S.ov||{})[d]||{};return L.map(l=>{const v=o[l.t];return!v||l.s==='break'?l:v==='x'?{...l,x:1}:{...l,s:v,chg:1}})};
const toM=t=>{const[a,b]=t.split(':');return +a*60+ +b};
const fm=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const eod=L=>{const r=L.filter(l=>l.s!=='break'&&l.s!=='free'&&!l.x).pop();return r?fm(toM(r.t)+45):null};
function wkStart(){const d=new Date(),w=d.getDay();d.setDate(d.getDate()-w);return d}
const dayDate=i=>{const d=wkStart();d.setDate(d.getDate()+i);return iso(d)};
function tmr(){
 const n=new Date(),nm=n.getHours()*60+n.getMinutes(),e0=holAt(TODAY)?null:eod(eff(TODAY,S.sched[td]||[]));
 if(e0&&nm<toM(e0))return '';
 const d=new Date();let why='';
 for(let i=0;i<130;i++){d.setDate(d.getDate()+1);const ds=iso(d),dw=d.getDay(),h=dw===6?'שבת':holAt(ds),L=h?[]:eff(ds,S.sched[dw]||[]),en=eod(L);
  if(en){const real=L.filter(l=>l.s!=='break'&&l.s!=='free'&&!l.x),g=[];
   L.filter(l=>l.s!=='break'&&!l.x).forEach(l=>{const p=g[g.length-1];if(p&&p.s===l.s)p.n++;else g.push({s:l.s,n:1})});
   const due=S.tasks.filter(t=>!t.done&&t.date===ds).sort(byDate);
   return `<div class="tm"><b>🌙 ${i?'היום הבא':'מחר'} · יום ${DN[dw]}, ${fd(ds)}</b>${why?`<div class="tml">${why}</div>`:''}<div class="tml">מתחילים ב-${real[0].t} · מסיימים ב-${en}</div>${dnote(ds)}<div class="chips">${g.map(x=>{const s=x.s==='free'?{name:'חלון',icon:'',color:'#999'}:sub(x.s);return `<i class="chip" style="--c:${esc(s.color)}">${x.s==='free'?'':esc(s.icon)+' '}${esc(s.name)}${x.n>1?' ×'+x.n:''}</i>`}).join('')}</div><div class="tml" style="margin-top:10px">${due.length?'להגשה '+(i?'ביום הזה':'מחר'):'אין משימות להגשה'+(i?'':' מחר')+' 🎉'}</div>${due.slice(0,3).map(t=>row(t,1)).join('')}${due.length>3?`<button class="tml" style="color:var(--ac)" data-a="nav" data-i="tasks">ועוד ${due.length-3} משימות ←</button>`:''}</div>`}
  if(i===0)why='מחר: '+(h||'אין שיעורים')}
 return ''}
function home(){const L=eff(dayDate(U.day),S.sched[U.day]||[]),n=new Date(),hr=n.getHours(),nm=hr*60+n.getMinutes(),isT=U.day===td&&td<=5&&!holAt(TODAY);
